name: Seed roster

# The roster is the authorization boundary, so it is seeded through Actions
# with the deployment identity — never from a workstation. Addresses are typed
# into the dispatch form by an admin and are never committed to the repository.

on:
  workflow_dispatch:
    inputs:
      roster:
        description: 'JSON array: [{"displayName","email"?,"role":"member|admin"}] - omit email to create a pending member'
        required: true
        type: string
      dry_run:
        description: 'Validate and print the plan without writing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: seed-roster
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production          # protected: reviewers gate a real write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @coffee-sub/api

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Seed
        env:
          # Azure SDK picks the OIDC federated credential up from these.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          STORAGE_ACCOUNT_NAME: smartinnovdigitalassets
          ALLOWED_EMAIL_DOMAIN: gmail.com
          ROSTER_JSON: ${{ inputs.roster }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node api/dist/scripts/seedRoster.js
