name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml', 'package.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pages used to publish on every push with nothing able to stop it, so a red
  # suite shipped regardless. `deploy-api.yml` has always gated itself this way;
  # the web deploy now matches. Self-contained rather than a `workflow_run` on
  # CI, so the gate cannot be defeated by a race between two workflows.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc -b web/tsconfig.json --noEmit

      # Before the unit tests: `generated-sw.test.ts` reads dist/sw.js and skips
      # when it is absent, so building afterwards makes that guard vacuous.
      - name: Build web
        env:
          VITE_BASE_PATH: /coffee-sub-tracker/
        run: npm run build -w @coffee-sub/web

      - name: Web tests
        run: npm test -w @coffee-sub/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Update lifecycle e2e
        run: npm run test:e2e -w @coffee-sub/web

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deploy
          path: web/playwright-report/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The Firebase web config identifies the project; it authorises nothing,
      # so it lives in repository *variables*, not secrets.
      - name: Build
        env:
          # A GitHub Pages *project* site is served from a subpath. The
          # Cloudflare workflow builds the same source with '/'.
          VITE_BASE_PATH: /coffee-sub-tracker/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ALLOWED_EMAIL_DOMAIN: ${{ vars.VITE_ALLOWED_EMAIL_DOMAIN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -w @coffee-sub/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
